preprocessing:
  output_dir: "/path/to/output"
  wsi_dir: "/path/to/wsis"
  extractor: "conch1_5"
  device: "cuda"
  cache_dir: "/path/to/tile_cache"
  tile_size_px: 224          # tile_size_um stays at the default (256)
  max_workers: 8
  save_visualisations: true
  visualisation_max_dimension: 4000

pipeline:
  experiment: "my_experiment"     # results go in <output_dir>/<experiment>/<run>/
  # run: "first_n"                # this run's folder; default derived from the settings
  clinical_table: "/path/to/clinical_table.csv"   # Patient, StudyID/SlideID, isLNM, hospital
  order: "extract_then_sample"

  sampling:
    n_tiles: 8192
    strategy: "first_n"
    pad_mode: "none"

  encoder: "titan"

  workers:
    hosts: ["host1", "host2"]      # machines with passwordless ssh and shared storage
    project_dir: "/path/to/STAMP"
    activate: "source /path/to/STAMP/.venv/bin/activate"
