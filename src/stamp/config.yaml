preprocessing:
  output_dir: "/csse/research/cancerimages/CRC_Dataset/patient_pipeline"
  wsi_dir: "/csse/research/cancerimages/CRC_Dataset/wsis"
  extractor: "conch1_5"
  device: "cuda"
  cache_dir: "/csse/research/cancerimages/CRC_Dataset/wsis/conch_cache"
  tile_size_px: 224          # tile_size_um stays at the default (256)
  max_workers: 8
  save_visualisations: true
  visualisation_max_dimension: 4000

pipeline:
  clinical_table: "/csse/research/cancerimages/CRC_Dataset/dataset_5_patients.csv"   # Patient, StudyID/SlideID, isLNM, hospital
  order: "extract_then_sample"

  sampling:
    n_tiles: 8192
    strategy: "first_n"
    pad_mode: "none"

  encoder: "titan"

  workers:
    hosts: ["cs250053kx", "cs250054kx"]      # your lab machines
    project_dir: "/csse/users/mot30/Masters/STAMP"
    activate: "source /csse/users/mot30/Masters/STAMP/.venv/bin/activate"